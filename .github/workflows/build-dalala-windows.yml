name: Build Dalala School (Windows installer)

on:
  push:
    paths:
      - 'dalala-school/**'
      - '.github/workflows/build-dalala-windows.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dalala-school/desktop
    steps:
      # Only check out the school system: other folders in this repo contain paths too long for Windows
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dalala-school

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dalala-school/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist:builder -- -c.win.signAndEditExecutable=true

      - uses: actions/upload-artifact@v4
        with:
          name: Dalala-School-Setup
          path: dalala-school/desktop/dist/*.exe
          if-no-files-found: error
